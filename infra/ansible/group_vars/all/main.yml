# 公開してよい設定だけを書く。パスワードなどは vault.yml（暗号化・.gitignore 済み）へ。

timezone: Asia/Tokyo

# サーバーにログインする作業用ユーザー（root でのログインは site.yml で禁止する）
deploy_user: deploy
deploy_public_key: "{{ lookup('file', '~/.ssh/conoha_toshlab.pub') }}"

# メモリ2GBのVPSなので、スワップを2GB足しておく
swap_size_mb: 2048

php_version: "8.4"

# --- toshlab ---
app_name: toshlab
app_domain: toshlab.jp
app_domains:
  - toshlab.jp
  - www.toshlab.jp
  - shuttttttto.com
  - www.shuttttttto.com
app_dir: /var/www/toshlab
app_repo: git@github.com:toshlab/tosh_lab.git
app_branch: main

db_name: toshlab
db_user: toshlab

# Let's Encrypt の期限切れ通知が届くメールアドレス（vault.yml で設定）
letsencrypt_email: "{{ vault_letsencrypt_email }}"

# --- バックアップ（roles/backup） ---
backup_dir: /var/backups/toshlab
backup_keep_days: 14
backup_time: "03:30:00"

# --- ブログ記事の取り込み（roles/posts_sync、docs/blog-import-plan.md） ---
posts_sync_user: publisher
posts_content_dir: /var/www/toshlab-content
# GitHub Actions が使う、取り込み専用の鍵の公開鍵（Mac で作ったもの。秘密鍵は GitHub Secrets にだけ置く）
posts_actions_public_key: "{{ lookup('file', '~/.ssh/toshlab_posts_actions.pub') }}"
