- name: パッケージ一覧を更新して、全体をアップグレード
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: よく使うパッケージ
  ansible.builtin.apt:
    name:
      - git
      - unzip
      - curl
      - ca-certificates
      - software-properties-common
      - acl
    state: present

- name: タイムゾーン
  community.general.timezone:
    name: "{{ timezone }}"
